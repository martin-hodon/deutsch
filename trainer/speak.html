<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Bench</title>
<style>
  :root { --bg: #f3f2f8; --card: #fff; --ink: #1d1d2b; --mute: #6f6f85; --line: #dcd8ee; --accent: #0d9488; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15141d; --card: #211f2d; --ink: #ecebf5; --mute: #9a98b0; --line: #393650; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  input, button, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input { flex: 1; min-width: 180px; }
  button { cursor: pointer; } button.voice { background: var(--accent); border-color: var(--accent); color: #fff; }
  #words button { margin: 3px; }
  .mute { color: var(--mute); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Speech bench</h1>
  <p class="mute">The trainer's own voice (trainer/speak.js): a word looked up in deutsch.tsv, or any IPA, spoken as a man, a
    woman or a child. Serve the folder (python3 -m http.server) and open this page.</p>
  <div class="row"><input id="word" placeholder="a German word (Hund, sprechen, Mädchen)"><span id="found" class="mute"></span></div>
  <div class="row"><input id="ipa" placeholder="or its IPA (ˈʃpʁɛçən)"></div>
  <div class="row">
    <button class="voice" data-kind="man">▶ man</button><button class="voice" data-kind="woman">▶ woman</button><button class="voice" data-kind="child">▶ child</button>
    <select id="level"><option value="1">quiet</option><option value="2" selected>medium</option><option value="3">loud</option></select>
    <span id="ms" class="mute"></span>
  </div>
  <div id="words"></div>
</main>
<script type="module">
import { createVoice, render } from "./trainer/speak.js";
const $ = (id) => document.getElementById(id), voice = createVoice();
const ipaOf = new Map();
for (const line of (await (await fetch("deutsch.tsv")).text()).trim().split("\n").slice(1)) {
  const f = line.split("\t");   // (columns: category root derived freq pos article word plural ipa ...)
  if (!ipaOf.has(f[6])) ipaOf.set(f[6], f[8]);
}
$("word").oninput = () => { const ipa = ipaOf.get($("word").value.trim()); $("found").textContent = ipa ? `[${ipa}]` : ""; if (ipa) $("ipa").value = ipa; };
const play = (kind) => {
  voice.kind = kind; voice.level = Number($("level").value);
  const t0 = performance.now(); render($("ipa").value, kind); const ms = performance.now() - t0;   // (timed apart from playing)
  voice.say($("ipa").value); $("ms").textContent = `made in ${ms.toFixed(1)} ms`;
};
for (const b of document.querySelectorAll(".voice")) b.onclick = () => play(b.dataset.kind);
const SAMPLE = "Haus Hund Katze Wasser Schule Mädchen Baum Größe Brot Milch Zeitung Pferd Buch Kirche Stuhl Tisch Fenster Garten Vogel Fisch Nacht Woche Sonne Mond Straße Freund Kopf Hand Auge Zahn sprechen gehen schlafen trinken essen lesen schreiben fahren kaufen grün Bücher Bäume Häuser Mädchen ich ach Küche".split(" ");
$("words").replaceChildren(...SAMPLE.filter((w) => ipaOf.has(w)).map((w) => { const b = document.createElement("button"); b.textContent = w; b.onclick = () => { $("word").value = w; $("word").oninput(); play(document.querySelector(".voice.last")?.dataset.kind ?? "man"); }; return b; }));
for (const b of document.querySelectorAll(".voice")) b.addEventListener("click", () => { for (const o of document.querySelectorAll(".voice")) o.classList.toggle("last", o === b); });
</script>
</body>
</html>
